name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SANITY_PROJECT_ID: h2acecwq
      PUBLIC_SANITY_DATASET: production
      PUBLIC_SANITY_API_VERSION: '2024-01-01'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
